services:
  db:
    image: postgres:16
    container_name: results-postgres
    environment:
      POSTGRES_DB: results_db
      POSTGRES_USER: results_user
      POSTGRES_PASSWORD: results_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results_user -d results_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: results-app
    environment:
      APP_NAME: ResultsService
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://results_user:results_pass@db:5432/results_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
